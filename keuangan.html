<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatan Pengeluaran Harian</title>
  <style>
    /* CSS Dasar Diambil dari File Parfum */
    body {
      margin: 0; font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #2c3e50, #34495e); color: #fff;
    }
    .container {
      max-width: 700px; margin: 20px auto; background: #1e272e;
      padding: 20px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    h2 { text-align: center; margin-bottom: 20px; }
    input, select, button {
      width: 100%; padding: 10px; margin: 10px 0;
      border: none; border-radius: 8px; font-size: 14px;
    }
    input, select { background: #2d3436; color: #fff; }
    button { background: #0984e3; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #74b9ff; }
    .hidden { display: none; }
    .table-wrapper { overflow-x: auto; }
    table {
      width: 100%; border-collapse: collapse; margin-top: 15px; min-width: 650px;
    }
    th, td {
      border: 1px solid #555; padding: 8px; text-align: center;
    }
    th { background: #0984e3; }
    .logout { background: #d63031; margin-top: 10px; }
    .logout:hover { background: #ff7675; }
    .hapusBtn, .editBtn {
      padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer;
    }
    .hapusBtn { background: #d63031; color: #fff; }
    .hapusBtn:hover { background: #ff7675; }
    .editBtn { background: #00b894; color: #fff; margin-left: 5px; }
    .editBtn:hover { background: #55efc4; }
    .exportBtn { background: #6c5ce7; margin-top: 10px; }
    .exportBtn:hover { background: #a29bfe; }
    .register-btn { background-color: #ffc107; color: black; margin-top: 5px; }
    .register-btn:hover { background-color: #e0a800; }
    /* Penyesuaian khusus untuk kolom uang */
    #transaksiList td:nth-child(3) { text-align: right; }
    #transaksiList td:nth-child(4) { text-align: center; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <div class="container" id="authPage">
    <h2>Login / Daftar Akun</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="register()" class="register-btn">Daftar Akun</button>
  </div>

  <div class="container hidden" id="mainPage">
    <h2>Catatan Pengeluaran Harian</h2>
    
    <input type="date" id="expenseDate">
    <input type="text" id="expenseDescription" placeholder="Keterangan Pengeluaran">
    <input type="number" id="expenseAmount" placeholder="Jumlah (Rp)">
    <select id="expenseCategory">
      <option value="">Pilih Kategori</option>
      <option value="Makan">Makan</option>
      <option value="Transportasi">Transportasi</option>
      <option value="Belanja">Belanja</option>
      <option value="Hiburan">Hiburan</option>
      <option value="Tagihan">Tagihan</option>
      <option value="Lainnya">Lainnya</option>
    </select>
    
    <button onclick="addExpense()">Tambah Pengeluaran</button>
    
    <button class="logout" onclick="logout()">Logout</button>
    <button class="exportBtn" onclick="exportExcel()">Export ke Excel</button>
    <button class="exportBtn" onclick="exportPDF()">Export ke PDF</button>

    <h3>Daftar Pengeluaran</h3>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Keterangan</th>
            <th>Jumlah (Rp)</th>
            <th>Kategori</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="transaksiList"></tbody>
      </table>
    </div>

    <h3>Total Pengeluaran: <span id="totalPenjualan">Rp 0</span></h3>
  </div>

  <script>
    const authPage = document.getElementById("authPage");
    const mainPage = document.getElementById("mainPage");
    let editIndex = null;
    let loggedInUser = localStorage.getItem("loggedInUser");

    window.onload = function() {
        // Cek status login saat halaman dimuat
        if(loggedInUser){
            showMain();
        }
    }

    // =========================================================
    // FUNGSI AUTENTIKASI (Diambil dari file Parfum, diperkuat)
    // =========================================================

    function login(){
      // .trim() dan .toLowerCase() untuk ketahanan terhadap spasi dan kapitalisasi
      let user = document.getElementById("username").value.trim().toLowerCase();
      let pass = document.getElementById("password").value.trim().toLowerCase();
      let savedUser = localStorage.getItem("user_" + user);
      
      if (!user || !pass) {
        alert("Username dan password harus diisi!");
        return;
      }

      if(savedUser){
        // Cek password yang tersimpan
        if(JSON.parse(savedUser).password.toLowerCase() === pass){
          localStorage.setItem("loggedInUser", user);
          document.getElementById("username").value = "";
          document.getElementById("password").value = "";
          showMain();
        } else {
          alert("Username atau Password salah! (Cek kembali huruf besar/kecil)");
        }
      } else {
        alert("Username belum terdaftar! Silakan Daftar Akun.");
      }
    }

    function register(){
      let user = document.getElementById("username").value.trim().toLowerCase();
      let pass = document.getElementById("password").value.trim().toLowerCase();
      
      if (!user || !pass) {
        alert("Username dan password harus diisi!");
        return;
      }

      if(localStorage.getItem("user_" + user)){
        alert("Username sudah ada! Silakan login.");
        return;
      }
      
      // Simpan akun baru
      localStorage.setItem("user_" + user, JSON.stringify({username: user, password: pass}));
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
      alert("Pendaftaran berhasil! Silakan Login.");
    }

    function logout(){
      localStorage.removeItem("loggedInUser");
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
      location.reload();
    }

    function showMain(){
        authPage.classList.add("hidden");
        mainPage.classList.remove("hidden");
        renderTable();
    }

    // =========================================================
    // FUNGSI PENGELUARAN
    // =========================================================

    function getExpenseKey() {
        return "expenses_" + localStorage.getItem("loggedInUser");
    }

    function getExpenses() {
        return JSON.parse(localStorage.getItem(getExpenseKey())) || [];
    }

    function addExpense(){
      let date = document.getElementById("expenseDate").value;
      let description = document.getElementById("expenseDescription").value;
      let amount = document.getElementById("expenseAmount").value;
      let category = document.getElementById("expenseCategory").value;
      
      if(!date || !description || !amount || !category || parseInt(amount) <= 0){
        alert("Lengkapi semua data dan pastikan Jumlah > 0!");
        return;
      }

      let expenses = getExpenses();
      const expense = {date, description, amount: parseInt(amount), category};

      if(editIndex !== null){
        expenses[editIndex] = expense;
        editIndex = null;
        // Ganti tombol Tambah kembali ke default
        document.querySelector('#mainPage button[onclick="addExpense()"]').innerText = "Tambah Pengeluaran";
      } else {
        expenses.push(expense);
      }

      localStorage.setItem(getExpenseKey(), JSON.stringify(expenses));
      renderTable();

      document.getElementById("expenseDate").value = "";
      document.getElementById("expenseDescription").value = "";
      document.getElementById("expenseAmount").value = "";
      document.getElementById("expenseCategory").value = "";
    }

    function renderTable(){
      let expenses = getExpenses();
      let list = document.getElementById("transaksiList");
      list.innerHTML = "";
      let total = 0;
      
      expenses.forEach((e, index) => {
        total += e.amount;
        list.innerHTML += `<tr>
          <td>${e.date}</td>
          <td>${e.description}</td>
          <td style="text-align: right;">Rp ${e.amount.toLocaleString('id-ID')}</td>
          <td>${e.category}</td>
          <td>
            <button class="editBtn" onclick="editExpense(${index})">Edit</button>
            <button class="hapusBtn" onclick="deleteExpense(${index})">Hapus</button>
          </td>
        </tr>`;
      });
      document.getElementById("totalPenjualan").innerText = "Rp " + total.toLocaleString('id-ID');
    }

    function deleteExpense(index){
      if(!confirm("Yakin ingin menghapus pengeluaran ini?")) return;
      let expenses = getExpenses();
      expenses.splice(index, 1);
      localStorage.setItem(getExpenseKey(), JSON.stringify(expenses));
      renderTable();
    }

    function editExpense(index){
      let expenses = getExpenses();
      let e = expenses[index];
      
      // Isi form dengan data yang akan diedit
      document.getElementById("expenseDate").value = e.date;
      document.getElementById("expenseDescription").value = e.description;
      document.getElementById("expenseAmount").value = e.amount;
      document.getElementById("expenseCategory").value = e.category;
      
      editIndex = index;
      
      // Ubah tombol "Tambah Pengeluaran" menjadi "Simpan Perubahan"
      document.querySelector('#mainPage button[onclick="addExpense()"]').innerText = "Simpan Perubahan";
      alert("Silakan edit data di atas lalu klik 'Simpan Perubahan'");
    }

    // =========================================================
    // FUNGSI EXPORT
    // =========================================================

    // Export Excel (XLSX)
    function exportExcel(){
      let expenses = getExpenses();
      let total = expenses.reduce((sum, e) => sum + e.amount, 0);
      let data = [["No", "Tanggal", "Keterangan", "Jumlah (Rp)", "Kategori"]];
      
      expenses.forEach((e, i) => {
        data.push([i+1, e.date, e.description, e.amount, e.category]);
      });
      
      data.push(["", "", "", "Total", total]);
      
      let ws = XLSX.utils.aoa_to_sheet(data);
      let wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Pengeluaran");
      XLSX.writeFile(wb, `Pengeluaran_${localStorage.getItem("loggedInUser")}_${new Date().toISOString().slice(0, 10)}.xlsx`);
    }

    // Export PDF (Menggunakan jsPDF AutoTable)
    function exportPDF(){
      const { jsPDF } = window.jspdf;
      let doc = new jsPDF();
      doc.setFontSize(14);
      doc.text("Laporan Catatan Pengeluaran", 14, 15);
      
      let expenses = getExpenses();
      let total = expenses.reduce((sum, e) => sum + e.amount, 0);
      
      let rows = expenses.map((e, i) => [
        i+1, e.date, e.description, e.amount.toLocaleString('id-ID'), e.category
      ]);
      
      doc.autoTable({
        head: [["No", "Tanggal", "Keterangan", "Jumlah (Rp)", "Kategori"]],
        body: rows,
        startY: 25,
        styles: { fontSize: 10 },
        headStyles: { fillColor: [9,132,227] },
        foot: [["", "", "TOTAL", total.toLocaleString('id-ID'), ""]]
      });
      
      doc.save(`Pengeluaran_${localStorage.getItem("loggedInUser")}_${new Date().toISOString().slice(0, 10)}.pdf`);
    }
  </script>
</body>
</html>
